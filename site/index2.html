  --glow:0 6px 20px rgba(251,84,54,.32);

  --font-display:'Bricolage Grotesque', system-ui, sans-serif;
  --font-body:'Plus Jakarta Sans', system-ui, sans-serif;
  --font-mono:'JetBrains Mono', ui-monospace, monospace;

  --maxw:1180px;
}

*{box-sizing:border-box; margin:0; padding:0; min-width:0}
html{-webkit-text-size-adjust:100%; scroll-behavior:smooth; overflow-x:hidden; width:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{
  font-family:var(--font-body);
  color:var(--ink-800);
  background:var(--cream);
  line-height:1.45;
  letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
/* --- Themed browser surfaces (craft floor) --- */
::selection{background:var(--coral-200); color:var(--ink-900)}
::-webkit-scrollbar{width:12px; height:12px}
::-webkit-scrollbar-track{background:var(--cream-deep)}
::-webkit-scrollbar-thumb{background:var(--coral-300); border:3px solid var(--cream-deep); border-radius:var(--r-pill)}
::-webkit-scrollbar-thumb:hover{background:var(--coral-400)}
*{scrollbar-color:var(--coral-300) var(--cream-deep)}
:focus-visible{outline:2.5px solid var(--coral-500); outline-offset:3px; border-radius:6px}
a{color:inherit; text-decoration:none}

h1,h2,h3{font-family:var(--font-display); font-weight:700; line-height:1.06; letter-spacing:-.03em; color:var(--ink-900); text-wrap:balance}
.mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums; letter-spacing:-.02em}

.wrap{max-width:var(--maxw); margin-inline:auto; padding-inline:24px}
section{position:relative}

/* ============================================================ NAV */
.nav{position:sticky; top:0; z-index:60; background:rgba(251,244,238,.82);
  backdrop-filter:saturate(1.4) blur(14px); -webkit-backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--ink-200)}
.nav-in{display:flex; align-items:center; gap:16px; height:66px}
.brand{display:flex; align-items:center; gap:11px; font-family:var(--font-display); font-weight:800;
  font-size:20px; letter-spacing:-.03em; color:var(--ink-900)}
.brand img{width:34px; height:34px; border-radius:9px; box-shadow:var(--sh-sm)}
.nav-spacer{flex:1}
.nav-links{display:flex; gap:26px; align-items:center}
.nav-links a{font-size:15px; font-weight:600; color:var(--ink-600); transition:color .18s}
.nav-links a:hover{color:var(--ink-900)}
@media(max-width:760px){.nav-links{display:none}}
@media(max-width:560px){.nav .btn-primary{display:none}}
.lang{display:inline-flex; background:var(--cream-deep); border-radius:var(--r-pill); padding:3px;
  border:1px solid var(--ink-200)}
.lang button{font-family:var(--font-body); font-weight:700; font-size:13px; letter-spacing:.02em;
  color:var(--ink-600); background:none; border:0; cursor:pointer; padding:5px 11px; border-radius:var(--r-pill); transition:all .18s}
.lang button[aria-pressed="true"]{background:var(--paper); color:var(--ink-900); box-shadow:var(--sh-sm)}

.btn{display:inline-flex; align-items:center; gap:9px; font-family:var(--font-body); font-weight:700;
  font-size:15px; letter-spacing:-.01em; cursor:pointer; border:0; border-radius:var(--r-pill);
  padding:13px 22px; transition:transform .16s cubic-bezier(.2,.7,.3,1), box-shadow .2s, background .2s}
.btn svg{width:18px; height:18px}
.btn-primary{background:var(--coral-cta); color:#fff; box-shadow:var(--glow)}
.btn-primary:hover{background:var(--brand-press); transform:translateY(-2px); box-shadow:0 10px 26px rgba(251,84,54,.42)}
.btn-primary:active{background:var(--brand-press); transform:translateY(0)}
.btn-ghost{background:var(--paper); color:var(--ink-900); box-shadow:var(--sh-sm); border:1px solid var(--ink-200)}
.btn-ghost:hover{transform:translateY(-2px); box-shadow:var(--sh-card)}
.btn-sm{padding:9px 16px; font-size:14px}

/* ============================================================ HERO */
.hero{padding:64px 0 40px; position:relative; overflow:hidden}
.hero-grid{display:grid; grid-template-columns:1.02fr .98fr; gap:40px; align-items:center}
@media(max-width:920px){.hero-grid{grid-template-columns:1fr; gap:30px}}
.hero h1{font-size:clamp(2.15rem, 6.4vw, 4.4rem); font-weight:800; margin-bottom:20px; margin-top:8px}
.hero h1 em{font-style:normal; color:var(--brand); position:relative}
.hero .lead{font-size:clamp(1.05rem,1.6vw,1.28rem); color:var(--ink-600); max-width:34ch; margin-bottom:30px; line-height:1.5}
.hero-cta{display:flex; gap:13px; flex-wrap:wrap; align-items:center}
.hero-note{margin-top:18px; font-size:14px; color:var(--ink-600); display:flex; align-items:center; gap:9px}
.hero-note svg{width:16px; height:16px; color:var(--trust-500); flex:none}

/* flock of birds drifting behind hero */
.sky{position:absolute; inset:0; pointer-events:none; z-index:0; opacity:.5}
.sky .bird{position:absolute; color:var(--coral-200); animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-8vw)}to{transform:translateX(8vw)}}
.hero .wrap{position:relative; z-index:1}

/* ---- Showcase wall (THE ROLL: signature composition) ---- */
.wall{position:relative; min-width:0; max-width:100%; overflow:hidden}
.wall-cap{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; letter-spacing:0; color:var(--ink-600); margin-bottom:12px; padding-left:2px}
.wall-cap .live{width:8px; height:8px; border-radius:50%; background:var(--coral-500); flex:none}
.rail{display:flex; gap:16px; overflow-x:auto; padding:8px 4px 20px; scroll-snap-type:x mandatory; -ms-overflow-style:none}
.rail.auto{overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 5%,#000 93%,transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0,#000 5%,#000 93%,transparent 100%)}
.rail-track{display:flex; gap:16px}
.rail.auto .rail-track{animation:marquee 34s linear infinite}
.rail.auto:hover .rail-track{animation-play-state:paused}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(calc(-50% - 8px))}}
@media (prefers-reduced-motion:reduce){.rail.auto .rail-track{animation:none}}

.fcard{scroll-snap-align:start; flex:0 0 260px; background:var(--paper); border-radius:var(--r-card);
  box-shadow:var(--sh-card); border:1px solid var(--ink-100); padding:16px; position:relative;
  transition:transform .28s cubic-bezier(.2,.7,.3,1), box-shadow .28s, opacity .28s; will-change:transform}
.rail:hover .fcard{opacity:.62}
.rail .fcard:hover{opacity:1; transform:translateY(-8px) scale(1.02); box-shadow:var(--sh-lift); z-index:2}
.fcard-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:13px}
.vibe-tag{display:inline-flex; align-items:center; gap:7px; font-weight:700; font-size:13px;
  padding:6px 11px 6px 8px; border-radius:var(--r-pill)}
.vibe-tag svg{width:15px; height:15px}
.countdown{font-family:var(--font-mono); font-weight:700; font-size:13px; color:var(--coral-700);
  background:var(--coral-50); padding:5px 9px; border-radius:8px; font-variant-numeric:tabular-nums}
.countdown.soon{color:#fff; background:var(--coral-500)}
.fcard h4{font-family:var(--font-display); font-weight:700; font-size:17px; color:var(--ink-900); letter-spacing:-.02em; margin-bottom:6px}
.fcard .where{display:flex; align-items:center; gap:6px; font-size:14px; color:var(--ink-600); margin-bottom:16px}
.fcard .where svg{width:14px; height:14px; color:var(--ink-500); flex:none}
.fcard-foot{display:flex; align-items:center; justify-content:space-between}
.avatars{display:flex}
.avatars span{width:27px; height:27px; border-radius:50%; border:2.5px solid var(--paper); margin-left:-8px;
  display:grid; place-items:center; font-size:11px; font-weight:800; color:#fff; font-family:var(--font-body)}
.avatars span:first-child{margin-left:0}
.joined{font-size:13px; font-weight:700; color:var(--ink-600)}
.joined b{color:var(--ink-900)}
.seat{width:27px; height:27px; border-radius:50%; border:2px dashed var(--ink-300); margin-left:-8px; background:var(--cream)}

/* ============================================================ STRIP */
.strip{background:var(--ink-900); color:var(--cream); padding:22px 24px}
.strip-in{display:flex; gap:34px; align-items:center; justify-content:center; flex-wrap:wrap;
  padding:6px 20px; font-family:var(--font-display); font-weight:600; font-size:clamp(15px,2vw,19px); letter-spacing:-.02em}
.strip-in .sep{color:var(--coral-400)}
.strip-in b{color:#fff; font-weight:800}

/* ============================================================ SECTION SHELL */
.band{padding:88px 0}
.band.tint{background:linear-gradient(180deg,var(--cream) 0%, var(--cream-deep) 100%)}
.eyeless{max-width:640px; margin-bottom:52px}
.band h2{font-size:clamp(1.9rem,3.6vw,2.9rem); font-weight:800; margin-bottom:16px}
.band .sub{font-size:clamp(1rem,1.4vw,1.15rem); color:var(--ink-600); line-height:1.5}

/* ---- How it works : sequenced journey (not same-size cards) ---- */
.steps{display:grid; grid-template-columns:repeat(3,1fr); gap:0; position:relative}
@media(max-width:840px){.steps{grid-template-columns:1fr; gap:34px}}
.step{position:relative; padding:0 26px}
.step:not(:last-child){border-right:1px solid var(--ink-200)}
@media(max-width:840px){.step{border-right:0!important; padding:0}}
.step .n{font-family:var(--font-mono); font-weight:700; font-size:14px; color:var(--coral-600); margin-bottom:18px; display:inline-block}
.step-h{display:flex; align-items:center; gap:13px; margin-bottom:11px}
.step .si{color:var(--coral-500); flex:none; display:grid; place-items:center}
.step .si svg{width:32px; height:32px}
.step h3{font-size:1.35rem; font-weight:700}
.step p{font-size:15px; color:var(--ink-600); line-height:1.5; max-width:32ch}

/* ---- Dice moment ---- */
.dice-wrap{display:grid; grid-template-columns:1fr 1fr; gap:48px; align-items:center}
@media(max-width:840px){.dice-wrap{grid-template-columns:1fr; gap:36px}}
.dice-stage{background:var(--paper); border-radius:var(--r-xl); box-shadow:var(--sh-card);
  border:1px solid var(--ink-100); padding:38px; min-height:320px; display:grid; place-items:center; position:relative; overflow:hidden}
.dice-btn{background:none; border:0; cursor:pointer; display:grid; place-items:center; gap:20px}
.die{width:120px; height:120px; color:var(--coral-500); filter:drop-shadow(0 12px 22px rgba(251,84,54,.28)); transition:transform .1s}
.die.rolling{animation:roll .6s cubic-bezier(.3,.1,.3,1)}
@keyframes roll{0%{transform:rotate(0) scale(1)}25%{transform:rotate(160deg) scale(.86)}55%{transform:rotate(300deg) scale(1.08)}100%{transform:rotate(360deg) scale(1)}}
.dice-hint{font-weight:700; color:var(--ink-500); font-size:14px}
.dealt{position:absolute; inset:38px; display:none; opacity:0; transition:opacity .4s}
.dealt.show{display:block; opacity:1}
.dice-copy h2{margin-bottom:16px}

/* ---- Vibes ---- */
.vibes{display:flex; flex-wrap:wrap; gap:14px}
.vibe{display:inline-flex; align-items:center; gap:11px; background:var(--paper); border:1px solid var(--ink-200);
  border-radius:var(--r-pill); padding:12px 20px 12px 14px; font-weight:700; font-size:15px; color:var(--ink-900);
  box-shadow:var(--sh-sm); transition:transform .16s, box-shadow .2s; cursor:default}
.vibe:hover{transform:translateY(-3px); box-shadow:var(--sh-card)}
.vibe .g{width:38px; height:38px; border-radius:12px; display:grid; place-items:center; color:#fff}
.vibe .g svg{width:21px; height:21px}

/* ---- Trust ledger ---- */
.ledger{display:grid; grid-template-columns:1fr 1fr; gap:14px 40px}
@media(max-width:840px){.ledger{grid-template-columns:1fr}}
.lrow{display:flex; gap:18px; padding:22px 4px; border-top:1px solid var(--ink-200)}
.lrow .li{width:46px; height:46px; flex:none; border-radius:13px; display:grid; place-items:center;
  background:var(--trust-50); color:var(--trust-600); box-shadow:var(--sh-sm)}
.lrow .li svg{width:24px; height:24px}
.lrow.coral .li{background:var(--coral-50); color:var(--coral-600)}
.lrow h4{font-family:var(--font-display); font-weight:700; font-size:1.35rem; color:var(--ink-900); margin-bottom:6px; letter-spacing:-.02em}
.lrow p{font-size:14px; color:var(--ink-600); line-height:1.5}

/* ---- Close ---- */
.close{background:linear-gradient(155deg,var(--coral-500) 0%, var(--coral-600) 55%, var(--coral-700) 100%);
  color:#fff; border-radius:32px; padding:70px 40px; text-align:center; position:relative; overflow:hidden; box-shadow:var(--sh-lift)}
.close .sky{opacity:.35}
.close .sky .bird{color:rgba(255,255,255,.7)}
.close h2{color:#fff; font-size:clamp(2rem,4vw,3.1rem); font-weight:800; margin-bottom:16px; position:relative}
.close p{color:rgba(255,255,255,.92); font-size:1.15rem; max-width:44ch; margin:0 auto 30px; position:relative}
.close .btn-primary{background:#fff; color:var(--coral-700); box-shadow:0 10px 30px rgba(0,0,0,.18); position:relative}
.close .btn-primary:hover{background:#fff; transform:translateY(-2px)}
.close .mini{margin-top:20px; font-size:14px; color:rgba(255,255,255,.92); position:relative}

/* ============================================================ FOOTER */
footer{padding:52px 0 40px; border-top:1px solid var(--ink-200); background:var(--cream)}
.foot-in{display:flex; justify-content:space-between; gap:30px; flex-wrap:wrap; align-items:center}
.foot-brand{display:flex; align-items:center; gap:11px; font-family:var(--font-display); font-weight:800; font-size:20px; color:var(--ink-900)}
.foot-brand img{width:30px; height:30px; border-radius:8px}
.foot-links{display:flex; gap:26px; flex-wrap:wrap}
.foot-links a{font-size:14px; font-weight:600; color:var(--ink-600); transition:color .18s}
.foot-links a:hover{color:var(--coral-600)}
.foot-copy{width:100%; margin-top:26px; font-size:13px; color:var(--ink-500)}

/* reveal */
.reveal{opacity:0; transform:translateY(18px); transition:opacity .7s ease-out, transform .7s cubic-bezier(.2,.7,.3,1)}
.reveal.in{opacity:1; transform:none}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1; transform:none; transition:none}}

/* ---- Mobile fit ---- */
@media(max-width:560px){
  .wrap{padding-inline:18px}
  .hero{padding:34px 0 26px}
  .hero .lead{max-width:none}
  .band{padding:56px 0}
  .eyeless{margin-bottom:34px}
  .strip{padding:18px}
  .strip-in{gap:14px 22px; font-size:15px}
  .dice-wrap,.ledger{gap:26px}
  .dice-stage{padding:28px; min-height:260px}
  .die{width:96px; height:96px}
  .close{padding:52px 22px; border-radius:24px}
  .foot-in{flex-direction:column; align-items:flex-start; gap:18px}
  .lrow{padding:18px 2px}
  .step{padding:0}
}
</style>
</head>

<script>

    {key:'walk', tr:'Yürüyüş', en:'Walk', c:'var(--vibe-walk)',

    {key:'games', tr:'Oyun', en:'Games', c:'var(--vibe-games)',

    {key:'music', tr:'Müzik', en:'Music', c:'var(--vibe-music)',

  ];
  function vibeIco(v,size){return '<svg viewBox="0 0 24 24" '+S+' style="width:'+size+'px;height:'+size+'px">'+v.svg+'</svg>';}

  /* ---------- demo flocks (synthetic — labelled "örnek/sample") ---------- */
  var HOSTS=['Zeynep','Deniz','Ece','Mert','Selin','Kaan','Ada','Bora','Lara','Efe'];
  var FLOCKS=[

    {v:'games', tr:'Bilardo turu', en:'Pool night', place:'Kadıköy', j:2, t:4, s:4340},

  var AV=['var(--coral-500)','var(--vibe-walk)','var(--trust-500)','var(--vibe-music)','var(--vibe-bar)','var(--vibe-food)','var(--vibe-games)','var(--vibe-coffee)'];
  function vibeOf(k){for(var i=0;i<VIBES.length;i++)if(VIBES[i].key===k)return VIBES[i];return VIBES[0];}

  function cardHTML(f,idx){
    var v=vibeOf(f.v);
    var seats=f.j, total=f.t;
    var av='';
    for(var i=0;i<seats;i++){av+='<span style="background:'+AV[(idx+i)%AV.length]+'">'+HOSTS[(idx+i)%HOSTS.length].charAt(0)+'</span>';}
    for(var k=0;k<total-seats;k++){av+='<span class="seat"></span>';}
    var soon=f.s<600?' soon':'';
    return '<article class="fcard">'
      +'<div class="fcard-top">'
        +'<span class="vibe-tag" style="color:'+v.c+';background:color-mix(in srgb,'+v.c+' 12%,#fff)">'+vibeIco(v,15)+'<span data-vibe="'+v.key+'">'+v.tr+'</span></span>'

      +'</div>'
    +'</article>';
  }

  var html='';
  for(var i=0;i<FLOCKS.length;i++){html+=cardHTML(FLOCKS[i],i);}

  var LEDG=[
    {tone:'coral', tr:['Doğrulanmış kimlik','Herkes selfie + kimlikle doğrulanır. Doğrulanmadan kimse davetlere katılamaz.'],
      en:['Verified identity','Everyone is verified with a selfie + ID. No one joins invites until they pass.'],
      svg:'<path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/>'},
    {tone:'trust', tr:['Hep grup · en az 3 kişi','Bire bir buluşma yok. Her flock en az üç kişilik bir grup.'],
      en:['Group-only · 3+ people','No one-on-one meetups. Every flock is a group of at least three.'],
      svg:'<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9.5" r="2.3"/><path d="M3.5 19c.6-3 3-4.6 5.5-4.6S13.9 16 14.5 19"/><path d="M15 14.5c2 .2 3.7 1.6 4.2 4"/>'},
    {tone:'trust', tr:['Çift yönlü puan','Buluşma sonrası herkes birbirini puanlar. Düşük puanlar zamanla elenir.'],
      en:['Two-way ratings','Everyone rates each other after meeting. Low scores get filtered out over time.'],
      svg:'<path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 17l-5.2 2.6 1-5.8L3.5 9.7l5.9-.9z"/>'},
    {tone:'coral', tr:['Canlı konum paylaşımı','İstersen buluşma boyunca bir yakınınla canlı konumunu paylaş.'],
      en:['Live location sharing','If you want, share your live location with someone you trust for the meetup.'],
      svg:'<path d="M12 21s-7-5.2-7-11a7 7 0 0114 0c0 5.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/>'},
    {tone:'trust', tr:['Trust score','Davranışına göre 0–100 güven puanı. Doğrulama, zamanında gelme ve iyi puanlar yükseltir.'],
      en:['Trust score','A 0–100 score built from your behavior — verification, showing up on time, and good ratings.'],
      svg:'<path d="M4 19V5M4 19h16M8 15l3-3 2.5 2L19 8"/>'},
    {tone:'coral', tr:['Bildir & engelle','Rahatsız olduğunda tek dokunuşla bildir ya da engelle — bir daha o kişinin flock\'larını görmezsin.'],
      en:['Report & block','Uncomfortable? Report or block in one tap — you\'ll never see that person\'s flocks again.'],
      svg:'<path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/><path d="M12 8v4M12 15.5v.5"/>'}
  ];
  var lg=document.getElementById('ledger'), lh='';
  for(var li=0;li<LEDG.length;li++){var r=LEDG[li];
    lh+='<div class="lrow'+(r.tone==='coral'?' coral':'')+'"><span class="li"><svg viewBox="0 0 24 24" '+S+'>'+r.svg+'</svg></span>'
      +'<div><h4 data-l="'+li+'">'+r.tr[0]+'</h4><p data-lp="'+li+'">'+r.tr[1]+'</p></div></div>';}
  lg.innerHTML=lh;

  /* ---------- countdown ticker ---------- */
  function tick(){
    document.querySelectorAll('.countdown').forEach(function(el){
      var s=parseInt(el.getAttribute('data-sec'),10)-1;
      if(s<=0){s=1800+((Math.abs(el.textContent.length*777))%5400);} // recycle so it stays alive
      el.setAttribute('data-sec',s);
      el.textContent=fmt(s);
      if(s<600){el.classList.add('soon');}else{el.classList.remove('soon');}
    });
  }
  setInterval(tick,1000);

  /* ---------- dice ---------- */
  var PIP={1:[[50,50]],2:[[32,32],[68,68]],3:[[30,30],[50,50],[70,70]],
    4:[[32,32],[68,32],[32,68],[68,68]],5:[[32,32],[68,32],[50,50],[32,68],[68,68]],
    6:[[32,28],[68,28],[32,50],[68,50],[32,72],[68,72]]};
  function drawFace(n){var g=document.getElementById('pips'),h='';(PIP[n]||PIP[1]).forEach(function(p){h+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="7"/>';});g.innerHTML=h;}
  drawFace(5);
  var die=document.getElementById('die'), dbtn=document.getElementById('diceBtn'),
      dealt=document.getElementById('dealt'), dhint=document.getElementById('diceHint');
  var rolling=false;
  dbtn.addEventListener('click',function(){
    if(rolling)return; rolling=true;
    if(!reduce){die.classList.remove('rolling');void die.offsetWidth;die.classList.add('rolling');}
    var n=1+((Math.floor((Date.now()/97))%6)); // deterministic-ish, no Math.random dependency
    var idx=(n-1)%FLOCKS.length;
    setTimeout(function(){
      drawFace(n);
      dealt.innerHTML=cardHTML(FLOCKS[idx],idx);
      dealt.classList.add('show'); die.style.opacity=.12; dhint.style.opacity=.35;
      applyLang(curLang, dealt); rolling=false;
    }, reduce?0:560);
  });

  /* ---------- birds ---------- */
  function makeSky(el,count){
    if(!el||reduce)return; var h='';
    for(var i=0;i<count;i++){
      var top=(8+ (i*53)%80), left=(6+(i*37)%88), sz=16+ (i*13)%26, dur=9+(i*7)%12, del=(i*1.7)%6, op=.5+((i*11)%40)/100;
      h+='<svg class="bird" style="top:'+top+'%;left:'+left+'%;width:'+sz+'px;animation-duration:'+dur+'s;animation-delay:-'+del+'s;opacity:'+op+'"><use href="#bird"/></svg>';
    }
    el.innerHTML=h;
  }
  makeSky(document.getElementById('heroSky'),7);
  makeSky(document.getElementById('closeSky'),9);

  /* ---------- reveal on scroll ---------- */
  if('IntersectionObserver' in window && !reduce){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});},{threshold:.05, rootMargin:'0px 0px -6% 0px'});
    document.querySelectorAll('.reveal').forEach(function(el){io.observe(el);});
    // safety: nothing stays hidden if the observer never fires for it
    setTimeout(function(){document.querySelectorAll('.reveal:not(.in)').forEach(function(el){var r=el.getBoundingClientRect();if(r.top<innerHeight*1.1)el.classList.add('in');});},1400);
  }else{document.querySelectorAll('.reveal').forEach(function(el){el.classList.add('in');});}

  /* ---------- i18n ---------- */
  var curLang='tr';
  function applyLang(lang,root){
    root=root||document;
    root.querySelectorAll('[data-tr]').forEach(function(el){
      var val=el.getAttribute('data-'+lang);
      if(val==null)return;
      if(/<(em|span|b|svg)/i.test(val)){el.innerHTML=val;}else{el.textContent=val;}
    });
    // dynamic bits
    root.querySelectorAll('[data-vibe]').forEach(function(el){var v=vibeOf(el.getAttribute('data-vibe'));el.textContent=(lang==='en'?v.en:v.tr);});
    root.querySelectorAll('[data-fl]').forEach(function(el){var f=FLOCKS[+el.getAttribute('data-fl')];el.textContent=(lang==='en'?f.en:f.tr);});
    root.querySelectorAll('[data-join]').forEach(function(el){el.textContent=(lang==='en'?'joined':'katıldı');});
    root.querySelectorAll('[data-l]').forEach(function(el){var r=LEDG[+el.getAttribute('data-l')];el.textContent=(lang==='en'?r.en[0]:r.tr[0]);});
    root.querySelectorAll('[data-lp]').forEach(function(el){var r=LEDG[+el.getAttribute('data-lp')];el.textContent=(lang==='en'?r.en[1]:r.tr[1]);});
    if(root===document){document.documentElement.lang=lang; curLang=lang;}
  }
  document.querySelectorAll('.lang button').forEach(function(b){
    b.addEventListener('click',function(){
      var lang=b.getAttribute('data-lang');
      document.querySelectorAll('.lang button').forEach(function(x){x.setAttribute('aria-pressed', x===b?'true':'false');});
      applyLang(lang);
    });
  });
  applyLang('tr');
})();
</script>
</body>
</html>
